<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JU B格價寶 - 家庭共享版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0e17;
            --card-bg: #161c2a;
            --text-primary: #e2e8f0;
            --neon-blue: #38bdf8;
            --neon-green: #4ade80;
            --neon-gold: #fbbf24;
            --neon-red: #ef4444;
        }
        body { background-color: var(--bg-color); color: var(--text-primary); -webkit-tap-highlight-color: transparent; }
        input, select, textarea { background-color: #1f293a !important; color: var(--text-primary) !important; border-color: #2d3e50 !important; }
        input:focus, select:focus, textarea:focus { border-color: var(--neon-blue) !important; box-shadow: 0 0 10px rgba(56, 189, 248, 0.5) !important; }
        .neon-text-blue { color: var(--neon-blue); text-shadow: 0 0 7px var(--neon-blue); }
        .neon-text-green { color: var(--neon-green); text-shadow: 0 0 10px rgba(74, 222, 128, 0.8); }
        .neon-border-gold { border-color: var(--neon-gold) !important; box-shadow: 0 0 15px rgba(251, 191, 36, 0.4); }
        .neon-badge-gold { background-color: #3b3010; color: var(--neon-gold); border: 1px solid var(--neon-gold); text-shadow: 0 0 5px var(--neon-gold); }
        .neon-shadow-blue { box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
        .neon-btn-blue { background-color: #0f172a; border: 2px solid var(--neon-blue); color: var(--neon-blue); text-shadow: 0 0 5px var(--neon-blue); box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); transition: all 0.2s ease-in-out; }
        .neon-btn-blue:hover, .neon-btn-blue:active { background-color: var(--neon-blue); color: #0a0e17; text-shadow: none; box-shadow: 0 0 20px rgba(56, 189, 248, 0.7); }
        @keyframes neon-pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        .neon-pulse { animation: neon-pulse 1.5s infinite; }
    </style>
</head>
<body class="font-sans min-h-screen pb-12">

    <!-- 全局讀取遮罩 -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black/80 z-[9999] flex flex-col justify-center items-center gap-3">
        <i class="fa-solid fa-circle-notch text-4xl text-sky-400 animate-spin"></i>
        <p class="text-sm tracking-wider text-sky-300 font-bold">正在同步雲端家庭數據...</p>
    </div>

    <header class="bg-card-bg sticky top-0 z-50 shadow-md border-b border-gray-800">
        <div class="px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide neon-text-blue"><i class="fa-solid fa-users mr-2"></i>JU B格價寶</h1>
            <button onclick="fetchCloudData()" class="text-xs bg-slate-800 text-sky-400 border border-sky-900/60 px-2.5 py-1 rounded-full font-bold">
                <i class="fa-solid fa-arrows-rotate mr-1"></i>手動整理
            </button>
        </div>
        <div class="flex border-t border-gray-800 text-sm font-bold text-center">
            <button id="tabPriceBtn" onclick="switchTab('price')" class="flex-1 py-3 text-sky-400 border-b-2 border-sky-400">
                <i class="fa-solid fa-list-ul mr-1"></i>格價清單
            </button>
            <button id="tabExpiryBtn" onclick="switchTab('expiry')" class="flex-1 py-3 text-gray-500 border-b-2 border-transparent">
                <i class="fa-solid fa-bell mr-1"></i>⏰ 臨期提醒 <span id="expiryBadge" class="hidden bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full ml-1">0</span>
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">
        <!-- 表單面板 -->
        <section id="formSection" class="bg-[#161c2a] p-5 rounded-2xl shadow-lg border border-gray-800 neon-shadow-blue">
            <h2 id="formTitle" class="text-lg font-bold text-gray-300 mb-4 flex items-center">
                <i class="fa-solid fa-circle-plus neon-text-blue mr-2"></i>新增家庭價格紀錄
            </h2>
            
            <form id="priceForm" class="space-y-4">
                <input type="hidden" id="editingRecordId" value="">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">商品名稱</label>
                    <input type="text" id="itemName" required placeholder="例如：維記鮮牛奶 1L" class="w-full px-3 py-2.5 rounded-xl text-sm transition-all placeholder-gray-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-sky-400 uppercase mb-1"><i class="fa-solid fa-copyright mr-1"></i>品牌 / 牌子 (選填)</label>
                    <input type="text" id="itemBrand" placeholder="例如：維記" class="w-full px-3 py-2.5 rounded-xl text-sm transition-all placeholder-gray-600">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">價格 ($)</label>
                        <input type="number" id="itemPrice" step="0.1" required placeholder="0.00" class="w-full px-3 py-2.5 rounded-xl text-sm transition-all placeholder-gray-600">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">購買日期</label>
                        <input type="date" id="itemDate" required class="w-full px-3 py-2.5 rounded-xl text-sm transition-all">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-yellow-500 uppercase mb-1"><i class="fa-regular fa-calendar-times mr-1"></i>過期日 (選填)</label>
                    <input type="date" id="expiryDate" class="w-full px-3 py-2.5 rounded-xl text-sm transition-all text-yellow-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">店舖 / 渠道</label>
                    <div class="flex gap-2">
                        <select id="shopSelect" class="flex-1 px-3 py-2.5 rounded-xl text-sm focus:outline-none"></select>
                        <button type="button" onclick="toggleInlineInput('InlineShop')" class="px-3 bg-slate-800 text-sky-400 border border-gray-700 rounded-xl text-sm"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <div id="wrapperInlineShop" class="hidden flex gap-2 mt-2 bg-[#111622] p-2 rounded-xl border border-dashed border-sky-900/60">
                        <input type="text" id="inputInlineShop" placeholder="新店舖" class="flex-1 px-2.5 py-1.5 rounded-lg text-xs">
                        <button type="button" onclick="addInlineItem('shop')" class="px-3 py-1.5 bg-sky-600 text-white rounded-lg text-xs font-bold"><i class="fa-solid fa-check"></i></button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">貨物類型</label>
                    <div class="flex gap-2">
                        <select id="categorySelect" class="flex-1 px-3 py-2.5 rounded-xl text-sm focus:outline-none"></select>
                        <button type="button" onclick="toggleInlineInput('InlineCategory')" class="px-3 bg-slate-800 text-sky-400 border border-gray-700 rounded-xl text-sm"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <div id="wrapperInlineCategory" class="hidden flex gap-2 mt-2 bg-[#111622] p-2 rounded-xl border border-dashed border-sky-900/60">
                        <input type="text" id="inputInlineCategory" placeholder="新類型" class="flex-1 px-2.5 py-1.5 rounded-lg text-xs">
                        <button type="button" onclick="addInlineItem('category')" class="px-3 py-1.5 bg-sky-600 text-white rounded-lg text-xs font-bold"><i class="fa-solid fa-check"></i></button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">備註 (選填)</label>
                    <input type="text" id="itemRemarks" placeholder="例如：幫媽咪買的" class="w-full px-3 py-2.5 rounded-xl text-sm transition-all placeholder-gray-600">
                </div>
                <div class="flex gap-2">
                    <button type="button" id="cancelEditBtn" onclick="exitEditMode()" class="hidden flex-1 bg-gray-800 border border-gray-700 text-gray-400 font-bold py-3 rounded-xl text-sm">取消修改</button>
                    <button type="submit" id="submitBtn" class="flex-[2] neon-btn-blue active:scale-[0.98] font-bold py-3 rounded-xl shadow-lg flex justify-center items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> <span id="submitBtnText">上傳雲端儲存</span>
                    </button>
                </div>
            </form>
        </section>

        <!-- 【歷史清單】 -->
        <section id="panelPrice" class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-lg font-bold text-gray-300 flex items-center"><i class="fa-solid fa-list-ul neon-text-blue mr-2"></i>家庭共用歷史</h2>
                <button id="clearAllBtn" class="text-xs text-red-400 hover:text-red-600 p-1"><i class="fa-solid fa-trash-can mr-1"></i>清空全部</button>
            </div>
            <div class="bg-[#161c2a] p-3 rounded-xl border border-gray-800 flex gap-2 neon-shadow-blue">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-gray-600 text-xs"></i>
                    <input type="text" id="searchBar" placeholder="搜尋名稱/店舖/類別..." class="w-full pl-8 pr-3 py-2 rounded-lg text-xs">
                </div>
            </div>
            <div id="recordsContainer" class="space-y-2.5"></div>
            <div id="paginationContainer" class="flex justify-center items-center gap-4 pt-2 text-sm"></div>
        </section>

        <!-- 【效期提醒】 -->
        <section id="panelExpiry" class="space-y-3 hidden">
            <div class="px-1"><h2 class="text-lg font-bold text-gray-300 flex items-center"><i class="fa-solid fa-hourglass-half text-yellow-500 mr-2"></i>過期監控</h2></div>
            <div id="expiryContainer" class="space-y-2.5"></div>
        </section>
    </main>

    <script>
        // ⚠️⚠️⚠️ 請將下方引號內換成你在 Google Apps Script 複製的網頁應用程式網址 ⚠️⚠️⚠️
        const API_URL = "https://script.google.com/macros/s/AKfycbw4MhdAXtVeRaYWHlBdZFwZ7khr1178dz3u88LBybB7sIxLxsidDqLKfvtfC14z8ESk/exec";

        // DOM 連動
        const priceForm = document.getElementById('priceForm');
        const shopSelect = document.getElementById('shopSelect');
        const categorySelect = document.getElementById('categorySelect');
        const recordsContainer = document.getElementById('recordsContainer');
        const expiryContainer = document.getElementById('expiryContainer');
        const paginationContainer = document.getElementById('paginationContainer');
        const searchBar = document.getElementById('searchBar');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const itemDateInput = document.getElementById('itemDate');
        const expiryDateInput = document.getElementById('expiryDate');
        const itemRemarksInput = document.getElementById('itemRemarks');
        const expiryBadge = document.getElementById('expiryBadge');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const editingRecordId = document.getElementById('editingRecordId');
        const formTitle = document.getElementById('formTitle');
        const submitBtnText = document.getElementById('submitBtnText');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const formSection = document.getElementById('formSection');

        const PAGE_SIZE = 5;
        let currentPage = 1;
        let currentTab = 'price';
        let records = [];

        const todayStr = new Date().toISOString().split('T')[0];
        itemDateInput.value = todayStr;

        // 選單自訂清單（仍可放在本地快取，或隨意添加）
        let menuSettings = JSON.parse(localStorage.getItem('juBPricerMenuSettings')) || {
            shops: ["惠康", "百佳", "萬寧", "屈臣氏", "阿布泰", "HKTVMall"],
            categories: ["🍎 新鮮食品", "❄️ 急凍食品", "🧃 飲品包裝", "🧹 家居日用", "🧴 個人護理", "📦 其他"]
        };

        buildDropdowns();
        fetchCloudData(); // 初始化：直接從雲端抓取

        function showLoading(show) { if(show) loadingOverlay.classList.remove('hidden'); else loadingOverlay.classList.add('hidden'); }

        function buildDropdowns() {
            shopSelect.innerHTML = menuSettings.shops.map(s => `<option value="${s.trim()}">${s.trim()}</option>`).join('');
            categorySelect.innerHTML = menuSettings.categories.map(c => `<option value="${c.trim()}">${c.trim()}</option>`).join('');
        }

        // 從雲端 Google Sheets 獲取最新資料
        async function fetchCloudData() {
            if(!API_URL || API_URL.includes("你的_")) { alert("請先在代碼中填寫第 121 行的 API_URL 雲端網址！"); showLoading(false); return; }
            showLoading(true);
            try {
                const response = await fetch(API_URL);
                const cloudData = await response.json();
                // 轉換格式相容性
                records = cloudData.map(r => ({
                    ...r,
                    id: Number(r.id),
                    isUsed: String(r.isUsed).toLowerCase() === 'true'
                }));
                // 按日期降序排列
                records.sort((a,b) => b.id - a.id);
                refreshView();
            } catch (err) {
                console.error(err);
                alert("讀取雲端失敗，請檢查網址或權限設定！");
            } finally {
                showLoading(false);
            }
        }

        // 推送最新資料到雲端
        async function syncToCloud() {
            showLoading(true);
            try {
                await fetch(API_URL, {
                    method: "POST",
                    mode: "no-cors", // GAS 跨域必備
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action: "saveAll", records: records })
                });
                // 因為 no-cors 無法直接看 response，這裡稍等 1 秒後主動載入一次刷新數據
                setTimeout(fetchCloudData, 1200);
            } catch (err) {
                console.error(err);
                alert("同步至雲端失敗！");
                showLoading(false);
            }
        }

        // 表單提交
        priceForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const idValue = editingRecordId.value;
            const name = document.getElementById('itemName').value.trim();
            const brand = document.getElementById('itemBrand').value.trim();
            const price = parseFloat(document.getElementById('itemPrice').value).toFixed(1);
            const shop = shopSelect.value;
            const category = categorySelect.value;
            const date = itemDateInput.value;
            const expiry = expiryDateInput.value || "";
            const remarks = itemRemarksInput.value.trim();

            if (idValue) {
                records = records.map(r => r.id == idValue ? { ...r, name, brand, price, shop, category, date, expiry, remarks } : r);
            } else {
                records.unshift({ id: Date.now(), name, brand, price, shop, category, date, expiry, remarks, isUsed: false });
            }

            exitEditMode();
            syncToCloud(); // 觸發同步
        });

        window.enterEditMode = function(id) {
            const target = records.find(r => r.id === id);
            if (!target) return;
            editingRecordId.value = target.id;
            document.getElementById('itemName').value = target.name;
            document.getElementById('itemBrand').value = target.brand || '';
            document.getElementById('itemPrice').value = target.price;
            itemDateInput.value = target.date;
            expiryDateInput.value = target.expiry || '';
            shopSelect.value = target.shop;
            categorySelect.value = target.category;
            itemRemarksInput.value = target.remarks || '';

            formTitle.innerHTML = `<i class="fa-solid fa-pen-to-square text-amber-400 mr-2"></i>修改家庭格價紀錄`;
            submitBtnText.textContent = "更新修改至雲端";
            cancelEditBtn.classList.remove('hidden');
            formSection.scrollIntoView({ behavior: 'smooth' });
        }

        window.exitEditMode = function() {
            editingRecordId.value = "";
            document.getElementById('itemName').value = '';
            document.getElementById('itemBrand').value = '';
            document.getElementById('itemPrice').value = '';
            itemDateInput.value = todayStr;
            expiryDateInput.value = '';
            itemRemarksInput.value = '';
            formTitle.innerHTML = `<i class="fa-solid fa-circle-plus neon-text-blue mr-2"></i>新增家庭價格紀錄`;
            submitBtnText.textContent = "上傳雲端儲存";
            cancelEditBtn.classList.add('hidden');
        }

        window.markAsUsed = function(id) {
            records = records.map(r => r.id === id ? { ...r, isUsed: true } : r);
            syncToCloud();
        }

        window.deleteRecord = function(id) {
            if(confirm('確定要從雲端刪除呢筆紀錄嗎？')) {
                records = records.filter(r => r.id !== id);
                syncToCloud();
            }
        }

        clearAllBtn.addEventListener('click', () => {
            if (confirm('⚠️ 警告：這會清空全家人的雲端 Google Sheet 資料！確定？')) {
                records = [];
                syncToCloud();
            }
        });

        // 以下為純渲染邏輯（與之前相同）
        function refreshView() {
            const filteredPrices = getFilteredRecords();
            const totalItems = filteredPrices.length;
            const totalPages = Math.ceil(totalItems / PAGE_SIZE) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            const start = (currentPage - 1) * PAGE_SIZE;
            renderPriceList(filteredPrices.slice(start, start + PAGE_SIZE));
            renderPagination(totalPages);
            renderExpiryDashboard();
        }

        function getLowestPricesMap(allRecords) {
            const lowestMap = {};
            allRecords.forEach(r => {
                const n = r.name.toLowerCase().trim(); const p = parseFloat(r.price);
                if (!lowestMap[n] || p < lowestMap[n]) lowestMap[n] = p;
            });
            return lowestMap;
        }

        function renderPriceList(pageData) {
            if (pageData.length === 0) {
                recordsContainer.innerHTML = `<div class="text-center py-8 text-gray-600 text-sm bg-[#111622] rounded-2xl border border-dashed border-gray-800">未有任何數據</div>`;
                return;
            }
            const lowestPrices = getLowestPricesMap(records);
            recordsContainer.innerHTML = pageData.map(record => {
                const normName = record.name.toLowerCase().trim();
                const isLowest = parseFloat(record.price) === lowestPrices[normName] && records.filter(r=>r.name.toLowerCase().trim()===normName).length > 1;
                return `
                <div class="bg-[#161c2a] p-4 rounded-xl shadow-lg border ${!record.isUsed && isLowest ? 'neon-border-gold' : 'border-gray-800/80'} flex flex-col gap-2 ${record.isUsed ? 'opacity-60' : 'opacity-90'}">
                    <div class="flex justify-between items-center w-full">
                        <div class="space-y-1 flex-1 pr-2">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <span class="text-[10px] px-1.5 py-0.5 rounded font-medium bg-[#1f293a] text-gray-400">${record.category || '📦 未分類'}</span>
                                <span class="text-[10px] px-1.5 py-0.5 rounded font-bold bg-[#101827] text-gray-300 border border-gray-700"><i class="fa-solid fa-store mr-0.5"></i>${record.shop}</span>
                                ${!record.isUsed && isLowest ? `<span class="text-[10px] px-1.5 py-0.5 neon-badge-gold rounded font-black">🏁 最平</span>` : ''}
                                ${record.isUsed ? `<span class="text-[10px] px-1.5 py-0.5 bg-neutral-800 text-neutral-400 rounded">已完</span>` : ''}
                            </div>
                            <h3 class="text-base tracking-wide ${record.isUsed ? 'text-gray-500' : 'text-gray-100 font-bold'}">
                                ${record.brand ? `<span class="text-sky-400 font-medium text-sm mr-1">[${record.brand}]</span>` : ''}${record.name}
                            </h3>
                            <p class="text-[10px] text-gray-600"><i class="fa-regular fa-calendar-days mr-1"></i>${record.date}${record.expiry ? ` ｜ ⏳ 效期至 ${record.expiry}` : ''}</p>
                        </div>
                        <div class="text-right flex flex-col items-end justify-between min-h-[55px]">
                            <span class="text-lg font-black ${record.isUsed ? 'text-gray-500' : (isLowest ? 'neon-text-green' : 'text-emerald-500')}">$${record.price}</span>
                            <div class="flex gap-2 mt-2">
                                <button onclick="enterEditMode(${record.id})" class="text-gray-500 hover:text-amber-400 text-xs"><i class="fa-regular fa-pen-to-square"></i></button>
                                <button onclick="deleteRecord(${record.id})" class="text-gray-700 hover:text-red-500 text-xs"><i class="fa-regular fa-trash-can"></i></button>
                            </div>
                        </div>
                    </div>
                    ${record.remarks ? `<div class="pt-1.5 border-t border-gray-800/60 text-[11px] text-gray-500 italic"><span class="break-all">💬 ${record.remarks}</span></div>` : ''}
                </div>`;
            }).join('');
        }

        function renderPagination(totalPages) {
            if (totalPages <= 1) { paginationContainer.innerHTML = ''; return; }
            paginationContainer.innerHTML = `
                <button onclick="changePage(-1)" ${currentPage === 1 ? 'disabled class="opacity-30"' : 'class="text-sky-400 font-bold"'}>上一頁</button>
                <span class="text-gray-400">第 ${currentPage}/${totalPages} 頁</span>
                <button onclick="changePage(1)" ${currentPage === totalPages ? 'disabled class="opacity-30"' : 'class="text-sky-400 font-bold"'}>下一頁</button>`;
        }
        window.changePage = function(dir) { currentPage += dir; refreshView(); }

        function renderExpiryDashboard() {
            const today = new Date(); let alertCount = 0;
            const expiryItems = records.filter(r => r.expiry && !r.isUsed);
            if (expiryItems.length === 0) { expiryContainer.innerHTML = `<div class="text-center py-8 text-gray-600 text-sm">無過期監控貨品</div>`; expiryBadge.classList.add('hidden'); return; }
            expiryContainer.innerHTML = expiryItems.map(item => {
                const diffDays = Math.ceil((new Date(item.expiry) - today) / (1000 * 60 * 60 * 24));
                let badge = '';
                if (diffDays < 0) { alertCount++; badge = `<span class="text-[10px] px-1.5 py-0.5 bg-red-900/50 text-red-400 rounded-md neon-pulse">已過期 ${Math.abs(diffDays)} 天</span>`; }
                else if (diffDays <= 30) { alertCount++; badge = `<span class="text-[10px] px-1.5 py-0.5 bg-amber-900/50 text-amber-400 rounded-md">剩 ${diffDays} 天</span>`; }
                else { badge = `<span class="text-[10px] px-1.5 py-0.5 bg-emerald-900/30 text-emerald-400 rounded-md">安全</span>`; }
                return `
                <div class="bg-[#161c2a] p-4 rounded-xl border border-gray-800 flex justify-between items-center">
                    <div class="space-y-1">
                        <div class="flex items-center gap-1.5">${badge}<span class="text-[10px] text-gray-500">📍 ${item.shop}</span></div>
                        <h3 class="font-bold text-gray-100 text-sm">${item.brand ? `[${item.brand}] ` : ''}${item.name}</h3>
                    </div>
                    <button onclick="markAsUsed(${item.id})" class="text-xs font-bold py-1.5 px-3 rounded-lg border border-sky-500/40 text-sky-400 bg-sky-950/20 hover:bg-sky-400 hover:text-black">已用完</button>
                </div>`;
            }).join('');
            if(alertCount > 0) { expiryBadge.textContent = alertCount; expiryBadge.classList.remove('hidden'); } else { expiryBadge.classList.add('hidden'); }
        }

        window.toggleInlineInput = function(id) { document.getElementById('wrapper' + id).classList.toggle('hidden'); }
        window.addInlineItem = function(type) {
            if (type === 'shop') {
                const val = document.getElementById('inputInlineShop').value.trim(); if (!val) return;
                if (!menuSettings.shops.includes(val)) { menuSettings.shops.push(val); localStorage.setItem('juBPricerMenuSettings', JSON.stringify(menuSettings)); buildDropdowns(); }
                shopSelect.value = val; document.getElementById('wrapperInlineShop').classList.add('hidden');
            } else {
                const val = document.getElementById('inputInlineCategory').value.trim(); if (!val) return;
                if (!menuSettings.categories.includes(val)) { menuSettings.categories.push(val); localStorage.setItem('juBPricerMenuSettings', JSON.stringify(menuSettings)); buildDropdowns(); }
                categorySelect.value = val; document.getElementById('wrapperInlineCategory').classList.add('hidden');
            }
        }
        window.switchTab = function(tab) {
            currentTab = tab;
            document.getElementById('tabPriceBtn').className = tab === 'price' ? "flex-1 py-3 text-sky-400 border-b-2 border-sky-400" : "flex-1 py-3 text-gray-500 border-b-2 border-transparent";
            document.getElementById('tabExpiryBtn').className = tab === 'expiry' ? "flex-1 py-3 text-yellow-500 border-b-2 border-yellow-500" : "flex-1 py-3 text-gray-500 border-b-2 border-transparent";
            if(tab==='price'){ document.getElementById('panelPrice').classList.remove('hidden'); document.getElementById('panelExpiry').classList.add('hidden'); }
            else { document.getElementById('panelPrice').classList.add('hidden'); document.getElementById('panelExpiry').classList.remove('hidden'); }
        }
        function getFilteredRecords() {
            const kw = searchBar.value.toLowerCase().trim();
            return records.filter(r => r.name.toLowerCase().includes(kw) || (r.brand && r.brand.toLowerCase().includes(kw)) || r.shop.toLowerCase().includes(kw));
        }
        searchBar.addEventListener('input', () => { currentPage = 1; refreshView(); });
    </script>
</body>
</html>
